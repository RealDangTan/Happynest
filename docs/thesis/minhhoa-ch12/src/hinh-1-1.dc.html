  <use href="#mute" x="482" y="350" width="52" height="36"></use>
  <use href="#sad" x="398" y="450" width="48" height="48"></use>
  <use href="#sad" x="520" y="436" width="48" height="48"></use>

  <text x="772" y="368" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="700" fill="#2a5670">&gt; 2/3</text>
