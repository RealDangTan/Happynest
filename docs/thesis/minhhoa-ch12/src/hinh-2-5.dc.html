<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hình 2.5 Phân loại đa nhãn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#2a5670}a:hover{color:#22251f}
</style>
</helmet>
<div style="width: 960px; height: 520px; background: #ffffff; color: #1a1a1a; font-family: 'Inter', system-ui, sans-serif">
<svg width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="AI xếp phản hồi vào các ngăn của bộ chủ đề đang áp dụng; phản hồi về đăng nhập chậm và không nhận được mã vào hai ngăn Hiệu năng và Xác thực tài khoản; phản hồi không đạt ngưỡng tin cậy được giữ ở khay Chưa phân loại" style="display: block; font-family: Inter, system-ui, sans-serif">
  <defs>
    <symbol id="bird" viewBox="0 0 120 104">
      <path d="M14 64 C12 34 38 14 64 14 C92 14 110 36 108 62 C106 88 86 98 62 98 C36 98 16 88 14 64 Z" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="3.5"></path>
      <path d="M22 58 C34 48 56 52 62 70 C54 84 34 84 24 74 Z" fill="#C9C4B7" stroke="#2E2E2B" stroke-width="3"></path>
      <path d="M58 16 C55 6 63 3 65 9 C67 3 74 5 71 14" fill="none" stroke="#2E2E2B" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="82" cy="46" r="5" fill="#1A1A1A"></circle>
      <circle cx="83.6" cy="44.4" r="1.6" fill="#FFFFFF"></circle>
      <ellipse cx="90" cy="60" rx="5" ry="3.5" fill="#EFB9A6"></ellipse>
      <path d="M102 50 L116 56 L102 62 Z" fill="#E09A3A" stroke="#2E2E2B" stroke-width="2.5" stroke-linejoin="round"></path>
      <path d="M52 98 L50 103 M70 98 L72 103" stroke="#2E2E2B" stroke-width="3" stroke-linecap="round"></path>
    </symbol>
    <symbol id="bust" viewBox="0 0 80 84">
      <path d="M8 84 C8 60 22 50 40 50 C58 50 72 60 72 84 Z" fill="currentColor" stroke="#2E2E2B" stroke-width="3" stroke-linejoin="round"></path>
      <circle cx="40" cy="27" r="18" fill="#F3DCC8" stroke="#2E2E2B" stroke-width="3"></circle>
      <path d="M21 28 C18 2 62 2 59 28 C53 17 29 17 21 28 Z" fill="#2E2E2B"></path>
      <circle cx="47" cy="29" r="2.2" fill="#2E2E2B"></circle>
    </symbol>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2E2E2B"></path>
    </marker>
  </defs>

  <!-- phản hồi 1 -->
  <rect x="20" y="60" width="252" height="76" rx="16" fill="#F7EDC6" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="36" y="92" font-size="18" font-style="italic">“Đăng nhập chậm, không</text>
  <text x="36" y="118" font-size="18" font-style="italic">nhận được mã xác nhận”</text>
  <rect x="20" y="148" width="86" height="30" rx="15" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2"></rect>
  <text x="63" y="169" text-anchor="middle" font-size="18">tiêu cực</text>
  <rect x="114" y="148" width="80" height="30" rx="15" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2"></rect>
  <text x="154" y="169" text-anchor="middle" font-size="18">báo lỗi</text>
  <rect x="202" y="148" width="90" height="30" rx="15" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2"></rect>
  <text x="247" y="169" text-anchor="middle" font-size="18">mức vừa</text>
  <text x="20" y="204" font-size="18" fill="#3d4038">thuộc tính hỗ trợ</text>

  <!-- phản hồi 2 -->
  <rect x="20" y="300" width="252" height="76" rx="16" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="36" y="332" font-size="18" font-style="italic">“Nên có chế độ chữ to</text>
  <text x="36" y="358" font-size="18" font-style="italic">cho người lớn tuổi”</text>

  <path d="M276 100 C296 110 300 150 306 176" fill="none" stroke="#2E2E2B" stroke-width="2.5" marker-end="url(#ah)"></path>
  <path d="M276 336 C296 326 300 250 306 228" fill="none" stroke="#2E2E2B" stroke-width="2.5" marker-end="url(#ah)"></path>

  <!-- chim phân loại -->
  <use href="#bird" x="304" y="148" width="120" height="104"></use>
  <text x="364" y="282" text-anchor="middle" font-size="18" font-weight="700">AI phân loại</text>
  <text x="364" y="304" text-anchor="middle" font-size="18" fill="#3d4038">chỉ chọn trong</text>
  <text x="364" y="326" text-anchor="middle" font-size="18" fill="#3d4038">bộ chủ đề</text>

  <!-- ngưỡng -->
  <path d="M580 44 L580 330" stroke="#93321f" stroke-width="3" stroke-dasharray="8 6"></path>
  <text x="572" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#93321f">ngưỡng tin cậy</text>

  <!-- tủ chủ đề -->
  <text x="770" y="30" text-anchor="middle" font-size="18" font-weight="700">Bộ chủ đề đang áp dụng</text>
  <rect x="620" y="40" width="300" height="298" rx="10" fill="#B48E5C" stroke="#2E2E2B" stroke-width="3"></rect>
  <rect x="634" y="54" width="272" height="60" rx="6" fill="#FBF6EA" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <rect x="650" y="80" width="26" height="9" rx="4.5" fill="#2E2E2B"></rect>
  <text x="692" y="91" font-size="19" font-weight="700">Hiệu năng</text>
  <rect x="634" y="124" width="272" height="60" rx="6" fill="#FBF6EA" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <rect x="650" y="150" width="26" height="9" rx="4.5" fill="#2E2E2B"></rect>
  <text x="692" y="161" font-size="19" font-weight="700">Xác thực tài khoản</text>
  <rect x="634" y="194" width="272" height="60" rx="6" fill="#FBF6EA" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <rect x="650" y="220" width="26" height="9" rx="4.5" fill="#2E2E2B"></rect>
  <text x="692" y="231" font-size="19" fill="#3d4038">Thanh toán</text>
  <rect x="634" y="264" width="272" height="60" rx="6" fill="#FBF6EA" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <rect x="650" y="290" width="26" height="9" rx="4.5" fill="#2E2E2B"></rect>
  <text x="692" y="301" font-size="19" fill="#3d4038">Giao diện</text>

  <!-- hai nhãn cho phản hồi 1 -->
  <path d="M426 184 C500 160 540 92 628 86" fill="none" stroke="#2E2E2B" stroke-width="3" marker-end="url(#ah)"></path>
  <path d="M426 198 C500 194 540 156 628 154" fill="none" stroke="#2E2E2B" stroke-width="3" marker-end="url(#ah)"></path>
  <rect x="506" y="106" width="30" height="20" rx="4" fill="#F7EDC6" stroke="#2E2E2B" stroke-width="2"></rect>
  <rect x="520" y="160" width="30" height="20" rx="4" fill="#F7EDC6" stroke="#2E2E2B" stroke-width="2"></rect>
  <text x="436" y="98" font-size="19" font-weight="700" fill="#93321f">2 nhãn</text>

  <!-- phản hồi 2 không đạt ngưỡng -->
  <path d="M426 220 C480 236 530 248 568 250" fill="none" stroke="#2E2E2B" stroke-width="2.5" stroke-dasharray="6 5"></path>
  <circle cx="580" cy="250" r="13" fill="#FFFFFF" stroke="#93321f" stroke-width="3"></circle>
  <path d="M574 244 L586 256 M586 244 L574 256" stroke="#93321f" stroke-width="3" stroke-linecap="round"></path>
  <path d="M580 266 C580 330 600 376 632 400" fill="none" stroke="#2E2E2B" stroke-width="2.5" marker-end="url(#ah)"></path>

  <!-- khay chưa phân loại -->
  <g transform="rotate(-8 690 404)"><rect x="664" y="386" width="56" height="34" rx="6" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2"></rect><path d="M674 398 L708 398 M674 408 L698 408" stroke="#8f9286" stroke-width="2.5"></path></g>
  <path d="M630 410 L912 410 L898 470 L644 470 Z" fill="#EDEBE4" stroke="#2E2E2B" stroke-width="3" stroke-linejoin="round"></path>
  <text x="771" y="447" text-anchor="middle" font-size="20" font-weight="700">Chưa phân loại</text>
  <text x="771" y="500" text-anchor="middle" font-size="18" fill="#3d4038">giữ lại chờ người xem, không ép nhãn</text>
  <use href="#bust" x="540" y="408" width="62" height="65" style="color: #4f86a8"></use>
</svg>
</div>
</x-dc>

</body>
</html>
