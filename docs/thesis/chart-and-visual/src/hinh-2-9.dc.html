<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hình 2.9 Đường ray và khu vườn có rào</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#2a5670}a:hover{color:#22251f}
</style>
</helmet>
<div style="width: 960px; height: 540px; background: #ffffff; color: #1a1a1a; font-family: 'Inter', system-ui, sans-serif">
<svg width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Bên trái, quy trình định trước như đoàn tàu chạy qua các ga Lọc, Đếm, Lập bảng; bên phải, tác tử AI như chú chim trong khu vườn có rào: suy luận, gọi công cụ sau khi phần mềm kiểm tra, xem kết quả, hỏi đủ chưa rồi mới ra nhận định; hàng rào là giới hạn số vòng, thời gian, chi phí" style="display: block; font-family: Inter, system-ui, sans-serif">
  <defs>
    <symbol id="bird" viewBox="0 0 120 104">
      <path d="M14 64 C12 34 38 14 64 14 C92 14 110 36 108 62 C106 88 86 98 62 98 C36 98 16 88 14 64 Z" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="3.5"></path>
      <path d="M22 58 C34 48 56 52 62 70 C54 84 34 84 24 74 Z" fill="#C9C4B7" stroke="#2E2E2B" stroke-width="3"></path>
      <path d="M58 16 C55 6 63 3 65 9 C67 3 74 5 71 14" fill="none" stroke="#2E2E2B" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="82" cy="46" r="5" fill="#1A1A1A"></circle>
      <circle cx="83.6" cy="44.4" r="1.6" fill="#FFFFFF"></circle>
      <ellipse cx="90" cy="60" rx="5" ry="3.5" fill="#EFB9A6"></ellipse>
      <path d="M102 50 L116 56 L102 62 Z" fill="#E09A3A" stroke="#2E2E2B" stroke-width="2.5" stroke-linejoin="round"></path>
      <path d="M52 98 L50 103 M70 98 L72 103" stroke="#2E2E2B" stroke-width="3" stroke-linecap="round"></path>
    </symbol>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2E2E2B"></path>
    </marker>
  </defs>

  <!-- ===== QUY TRÌNH ĐỊNH TRƯỚC ===== -->
  <text x="235" y="36" text-anchor="middle" font-size="21" font-weight="700">Quy trình định trước</text>
  <text x="235" y="62" text-anchor="middle" font-size="18" fill="#3d4038">chương trình chạy đúng các bước</text>
  <rect x="70" y="108" width="330" height="50" rx="16" fill="#F7EDC6" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="235" y="140" text-anchor="middle" font-size="18" font-style="italic">Ví dụ: đếm phản hồi theo tháng</text>

  <path d="M30 380 L446 380" stroke="#8B6B43" stroke-width="26" stroke-dasharray="6 18"></path>
  <path d="M26 374 L450 374 M26 386 L450 386" stroke="#2E2E2B" stroke-width="3"></path>

  <path d="M170 372 L170 300 M280 372 L280 300 M390 372 L390 300" stroke="#2E2E2B" stroke-width="3"></path>
  <rect x="135" y="266" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="170" y="290" text-anchor="middle" font-size="18" font-weight="700">Lọc</text>
  <rect x="245" y="266" width="70" height="34" rx="6" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="280" y="290" text-anchor="middle" font-size="18" font-weight="700">Đếm</text>
  <rect x="338" y="266" width="104" height="34" rx="6" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="390" y="290" text-anchor="middle" font-size="18" font-weight="700">Lập bảng</text>

  <!-- đoàn tàu -->
  <circle cx="114" cy="304" r="7" fill="#FFFFFF" stroke="#8f9286" stroke-width="2"></circle>
  <circle cx="126" cy="290" r="9" fill="#FFFFFF" stroke="#8f9286" stroke-width="2"></circle>
  <rect x="36" y="322" width="38" height="50" rx="4" fill="#C9C4B7" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <rect x="44" y="330" width="22" height="16" rx="2" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2"></rect>
  <rect x="72" y="338" width="58" height="34" rx="8" fill="#DCC892" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <rect x="104" y="318" width="12" height="20" rx="2" fill="#2E2E2B"></rect>
  <circle cx="54" cy="372" r="9" fill="#2E2E2B"></circle>
  <circle cx="88" cy="372" r="9" fill="#2E2E2B"></circle>
  <circle cx="118" cy="372" r="8" fill="#2E2E2B"></circle>
  <path d="M136 356 L156 356" stroke="#2E2E2B" stroke-width="3" marker-end="url(#ah)"></path>

  <text x="235" y="438" text-anchor="middle" font-size="18" fill="#3d4038">bước cố định, lần nào cũng như nhau</text>
  <text x="235" y="464" text-anchor="middle" font-size="18" fill="#3d4038">hợp với phép đếm, lọc, tính điểm</text>

  <path d="M472 24 L472 516" stroke="#B9B6AA" stroke-width="2" stroke-dasharray="6 6"></path>

  <!-- ===== TÁC TỬ AI ===== -->
  <text x="716" y="36" text-anchor="middle" font-size="21" font-weight="700">Tác tử AI dùng công cụ</text>
  <text x="716" y="62" text-anchor="middle" font-size="18" fill="#3d4038">tự chọn bước, nhưng trong hàng rào</text>

  <!-- hàng rào có cổng -->
  <path d="M520 470 L512 470 Q496 470 496 454 L496 112 Q496 96 512 96 L920 96 Q936 96 936 112 L936 454 Q936 470 920 470 L580 470" fill="none" stroke="#8B6B43" stroke-width="12" stroke-dasharray="5 13"></path>
  <path d="M520 470 L512 470 Q496 470 496 454 L496 112 Q496 96 512 96 L920 96 Q936 96 936 112 L936 454 Q936 470 920 470 L580 470" fill="none" stroke="#2E2E2B" stroke-width="3"></path>
  <rect x="566" y="80" width="300" height="32" rx="6" fill="#DCC892" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="716" y="102" text-anchor="middle" font-size="18" font-weight="700">giới hạn: vòng · thời gian · chi phí</text>

  <!-- câu hỏi -->
  <rect x="514" y="124" width="236" height="56" rx="16" fill="#F7EDC6" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="632" y="148" text-anchor="middle" font-size="18" font-style="italic">“Vì sao nhiều người phàn</text>
  <text x="632" y="170" text-anchor="middle" font-size="18" font-style="italic">nàn về đăng nhập?”</text>

  <!-- vòng suy luận - công cụ - quan sát -->
  <path d="M650 200 A100 100 0 0 1 750 300" fill="none" stroke="#2E2E2B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"></path>
  <path d="M750 300 A100 100 0 0 1 650 400" fill="none" stroke="#2E2E2B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"></path>
  <path d="M650 400 A100 100 0 0 1 550 300" fill="none" stroke="#2E2E2B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"></path>
  <path d="M550 300 A100 100 0 0 1 650 200" fill="none" stroke="#2E2E2B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ah)"></path>
  <use href="#bird" x="610" y="264" width="80" height="69"></use>

  <rect x="604" y="186" width="92" height="30" rx="15" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="650" y="207" text-anchor="middle" font-size="18" font-weight="600">suy luận</text>
  <rect x="692" y="285" width="116" height="30" rx="15" fill="#E9E3F5" stroke="#4e3c85" stroke-width="2.5" stroke-dasharray="5 4"></rect>
  <text x="750" y="306" text-anchor="middle" font-size="18" font-weight="600">gọi công cụ</text>
  <rect x="588" y="386" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="650" y="407" text-anchor="middle" font-size="18" font-weight="600">xem kết quả</text>
  <rect x="504" y="285" width="92" height="30" rx="15" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <text x="550" y="306" text-anchor="middle" font-size="18" font-weight="600">đủ chưa?</text>

  <!-- phần mềm kiểm tra rồi mới chạy công cụ -->
  <path d="M810 300 L818 300" stroke="#2E2E2B" stroke-width="2.5"></path>
  <path d="M836 280 L854 286 L854 302 C854 314 846 320 836 324 C826 320 818 314 818 302 L818 286 Z" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5" stroke-linejoin="round"></path>
  <path d="M829 302 L834 307 L844 296" fill="none" stroke="#2e5e24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
  <path d="M856 302 L866 302" stroke="#2E2E2B" stroke-width="2.5" marker-end="url(#ah)"></path>
  <rect x="870" y="276" width="56" height="50" rx="6" fill="#B48E5C" stroke="#2E2E2B" stroke-width="2.5"></rect>
  <path d="M886 276 L886 268 L910 268 L910 276" fill="none" stroke="#2E2E2B" stroke-width="2.5"></path>
  <circle cx="886" cy="256" r="8" fill="#FFFFFF" stroke="#2E2E2B" stroke-width="2.5"></circle>
  <path d="M892 262 L897 268" stroke="#2E2E2B" stroke-width="3" stroke-linecap="round"></path>
  <rect x="902" y="246" width="12" height="22" rx="2" fill="#DCC892" stroke="#2E2E2B" stroke-width="2"></rect>
  <text x="876" y="350" text-anchor="middle" font-size="18" fill="#3d4038">công cụ</text>

  <g fill="none" stroke="#2e5e24" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M770 386 L775 391 L784 380"></path>
    <path d="M770 414 L775 419 L784 408"></path>
    <path d="M770 442 L775 447 L784 436"></path>
  </g>
  <text x="792" y="392" font-size="18">đúng sản phẩm</text>
  <text x="792" y="420" font-size="18">bộ lọc hợp lệ</text>
  <text x="792" y="448" font-size="18">còn lượt</text>

  <!-- ra khỏi cổng: nhận định -->
  <path d="M550 316 L550 488" stroke="#2E2E2B" stroke-width="2.5" marker-end="url(#ah)"></path>
  <text x="560" y="452" font-size="18" fill="#3d4038">đủ</text>
  <circle cx="550" cy="510" r="13" fill="#DCC892" stroke="#2E2E2B" stroke-width="2.5"></circle>
  <rect x="544" y="521" width="12" height="8" rx="2" fill="#2E2E2B"></rect>
  <text x="572" y="517" font-size="19" font-weight="700">nhận định</text>
</svg>
</div>
</x-dc>

</html>
